# Parámetros generales de la redistritación.
# Todos los valores de población usan la población georreferenciada del Censo 2024.

poblacion:
  objetivo: 90000      # habitantes por diputado
  minimo: 80000        # límite duro para distritos normales
  maximo: 100000       # límite duro para distritos normales

centros_urbanos:
  # Un centro urbano (conurbación INE o entidad urbana) con al menos esta población
  # tiene distrito propio; si supera el máximo, se divide en distritos dentro de la ciudad.
  umbral_distrito_propio: 80000
  # Centros urbanos que INE separa pero que se tratan como parte de otro.
  fusiones:
    CORONEL: GRAN CONCEPCIÓN
    LOTA: GRAN CONCEPCIÓN
    TOMÉ: GRAN CONCEPCIÓN

# Pesos ajustables de los criterios (jerarquía por defecto: de mayor a menor).
pesos:
  equilibrio_poblacion: 1.0
  tiempo_viaje: 0.6          # pueblos pequeños junto a su ciudad grande más cercana
  compacidad: 0.8            # basada en tiempo de viaje; forma como criterio secundario
  forma: 10.0                # compacidad geométrica (momento de inercia; 0 = círculo)
  centralidad_centro: 0.6    # el centro principal cerca del centro del distrito
  evitar_rios: 0.3           # preferencia fuerte, no prohibición
  no_dividir_comunas: 1.5    # por cada trozo adicional de una comuna

transbordadores:
  # La espera cuenta: se suma la mitad del intervalo entre salidas.
  # Si OSM no informa el intervalo, se usa uno por defecto según la travesía.
  # Cada ruta se puede corregir en config/transbordadores.yaml.
  intervalo_por_defecto_horas:
    corto: 1      # travesía de hasta 1,5 h (balsas, cruces de canal)
    medio: 24     # travesía de 1,5 a 8 h
    largo: 168    # travesía de más de 8 h (rutas semanales)

# Ríos principales: los límites de distrito evitan seguirlos (preferencia fuerte).
# Se toman de OSM por nombre; tramos con el mismo nombre de menos de
# `largo_minimo_km` (ríos homónimos pequeños) se descartan; un río puede
# indicar su propio mínimo con {nombre: ..., largo_minimo_km: ...}.
rios:
  largo_minimo_km: 20
  distancia_m: 300        # un borde a menos de esta distancia del río se considera "sobre el río"
  principales:
    - Río Lluta
    - Río San José
    - Río Loa
    - Río Copiapó
    - Río Huasco
    - Río Elqui
    - Río Limarí
    - Río Choapa
    - Río Aconcagua
    - Río Maipo
    - Río Mapocho
    - Río Rapel
    - Río Cachapoal
    - Río Tinguiririca
    - Río Mataquito
    - Río Maule
    - Río Itata
    - Río Ñuble
    - Río Biobío
    - Río Laja
    - Río Imperial
    - Río Cautín
    - Río Toltén
    - {nombre: Río Valdivia, largo_minimo_km: 5}   # estuario corto
    - Río Calle Calle
    - Río Bueno
    - Río Maullín
    - Río Puelo
    - Río Yelcho
    - Río Palena
    - Río Cisnes
    - Río Aysén
    - Río Baker
    - Río Pascua

proyeccion_metrica: "EPSG:32719"    # UTM 19S, para áreas y distancias
